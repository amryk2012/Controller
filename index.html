<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<meta name="screen-orientation" content="landscape"/>
<title>CTRL</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Orbitron:wght@800;900&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:     #07080d;
    --panel:  #0e1018;
    --border: #1c1f2e;
    --accent: #e8ff00;
    --red:    #ff3b3b;
    --blue:   #00c8ff;
    --text:   #c8cfe8;
    --muted:  #40485a;
    --btn:    #131620;
    --glow-y: 0 0 16px rgba(232,255,0,.5);
    --glow-r: 0 0 20px rgba(255,59,59,.6);
    --glow-b: 0 0 16px rgba(0,200,255,.4);
  }

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    touch-action: none;
  }

  @media (orientation: portrait) {
    #rotateMsg  { display: flex !important; }
    #app        { display: none !important; }
  }

  #rotateMsg {
    display: none;
    position: fixed; inset: 0; z-index: 999;
    background: var(--bg);
    flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px;
    text-align: center;
  }
  #rotateMsg svg { width: 64px; height: 64px; fill: var(--accent); animation: tilt 1.4s ease-in-out infinite; }
  @keyframes tilt { 0%,100% { transform: rotate(-15deg); } 50% { transform: rotate(15deg); } }
  #rotateMsg p { font-family:'Orbitron',sans-serif; font-size:.9rem; letter-spacing:.15em; color:var(--accent); }

  #app {
    display: flex;
    width: 100vw; height: 100vh;
    align-items: center; justify-content: center;
  }

  .screen {
    display: flex;
    flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px;
    width: 100%; height: 100%;
    padding: 24px;
    animation: fadeUp .45s ease;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(2rem,6vw,3.2rem);
    font-weight: 900;
    letter-spacing: .22em;
    color: var(--accent);
    text-shadow: var(--glow-y);
    line-height: 1;
  }
  .logo em { color: var(--blue); font-style: normal; text-shadow: var(--glow-b); }

  .subtitle {
    font-size: clamp(.7rem,2vw,1rem);
    letter-spacing: .18em;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* ── Name input ── */
  .name-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 100%;
    max-width: 280px;
  }
  .name-label {
    font-size: clamp(.55rem,1.4vw,.72rem);
    letter-spacing: .18em;
    color: var(--muted);
    text-transform: uppercase;
    align-self: flex-start;
    padding-left: 4px;
  }
  .name-input {
    width: 100%;
    background: var(--btn);
    border: 1.5px solid var(--border);
    color: var(--accent);
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(.7rem,1.8vw,.9rem);
    font-weight: 800;
    letter-spacing: .14em;
    padding: 10px 16px;
    outline: none;
    clip-path: polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
    transition: border-color .15s, box-shadow .15s;
    text-transform: uppercase;
  }
  .name-input::placeholder { color: var(--muted); opacity: .6; }
  .name-input:focus { border-color: var(--accent); box-shadow: var(--glow-y); }

  .cta {
    margin-top: 8px;
    background: var(--accent);
    color: #000;
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(.7rem,1.8vw,.9rem);
    font-weight: 900;
    letter-spacing: .18em;
    padding: 12px 40px;
    border: none;
    cursor: pointer;
    clip-path: polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);
    transition: box-shadow .15s, transform .1s;
  }
  .cta:hover  { box-shadow: var(--glow-y); }
  .cta:active { transform: scale(.96); }
  .cta:disabled { opacity: .35; cursor: not-allowed; }

  .spinner {
    width: 50px; height: 50px;
    border: 3px solid var(--blue);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    box-shadow: var(--glow-b);
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  .pulse-row { display:flex; align-items:center; gap:9px; font-size:.8rem; color:var(--muted); letter-spacing:.1em; }
  .pdot { width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:var(--glow-y); animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.25;transform:scale(.5)} }

  /* ── LEADERBOARD ── */
  .lb-wrap {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .lb-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(.55rem,1.5vw,.75rem);
    letter-spacing: .22em;
    color: var(--blue);
    text-shadow: var(--glow-b);
    text-align: center;
    margin-bottom: 4px;
  }
  .lb-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--btn);
    border: 1px solid var(--border);
    padding: 7px 14px;
    clip-path: polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%);
    animation: fadeUp .3s ease both;
  }
  .lb-row:nth-child(2) { animation-delay:.04s; }
  .lb-row:nth-child(3) { animation-delay:.08s; }
  .lb-row:nth-child(4) { animation-delay:.12s; }
  .lb-row:nth-child(5) { animation-delay:.16s; }
  .lb-rank {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(.5rem,1.3vw,.65rem);
    font-weight: 900;
    color: var(--muted);
    min-width: 20px;
    text-align: center;
  }
  .lb-row.top1 .lb-rank { color: var(--accent); text-shadow: var(--glow-y); }
  .lb-row.top2 .lb-rank { color: #c0c0c0; }
  .lb-row.top3 .lb-rank { color: #cd7f32; }
  .lb-name {
    flex: 1;
    font-size: clamp(.65rem,1.6vw,.85rem);
    letter-spacing: .1em;
    color: var(--text);
    text-transform: uppercase;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lb-score {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(.6rem,1.5vw,.78rem);
    font-weight: 900;
    color: var(--accent);
    text-shadow: var(--glow-y);
    white-space: nowrap;
  }
  .lb-empty {
    font-size: .7rem;
    color: var(--muted);
    letter-spacing: .12em;
    text-align: center;
    opacity: .6;
    padding: 8px 0;
  }

  /* ── SESSION ENDED OVERLAY ── */
  #sessionEndedOverlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 500;
    background: rgba(7,8,13,.92);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    animation: fadeUp .4s ease;
  }
  #sessionEndedOverlay.visible { display: flex; }
  .ended-icon {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(2.5rem,8vw,4.5rem);
    color: var(--accent);
    text-shadow: var(--glow-y);
    line-height: 1;
  }
  .ended-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(.9rem,2.5vw,1.4rem);
    font-weight: 900;
    letter-spacing: .22em;
    color: var(--accent);
    text-shadow: var(--glow-y);
  }
  .ended-sub {
    font-size: clamp(.65rem,1.6vw,.85rem);
    letter-spacing: .14em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .ended-score {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1.1rem,3vw,1.8rem);
    font-weight: 900;
    color: var(--blue);
    text-shadow: var(--glow-b);
    letter-spacing: .1em;
  }
  .ended-actions {
    display: flex;
    gap: 14px;
    margin-top: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn-outline {
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--muted);
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(.55rem,1.4vw,.7rem);
    font-weight: 900;
    letter-spacing: .16em;
    padding: 10px 24px;
    cursor: pointer;
    clip-path: polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
    transition: border-color .15s, color .15s, box-shadow .15s;
  }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); box-shadow: var(--glow-y); }

  /* ── CONTROLLER LAYOUT ── */
  #ctrl {
    display: none;
    width: 100vw; height: 100vh;
    align-items: center;
    justify-content: space-between;
    padding: 0 clamp(16px,4vw,48px);
    position: relative;
    animation: fadeUp .35s ease;
  }

  .centre {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex: 0 0 auto;
    z-index: 1;
  }
  .ctrl-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(.5rem,1.4vw,.75rem);
    letter-spacing: .22em;
    color: var(--accent);
    text-shadow: var(--glow-y);
  }
  .live-badge {
    display: flex; align-items: center; gap: 5px;
    font-size: clamp(.45rem,1.2vw,.65rem);
    letter-spacing: .12em;
    color: var(--muted);
  }
  .live-badge .dot { width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:var(--glow-y);animation:pulse 1.5s infinite; }

  .player-badge {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(.42rem,1.1vw,.6rem);
    color: var(--blue);
    letter-spacing: .1em;
    text-shadow: var(--glow-b);
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .session-badge {
    font-size: clamp(.4rem,1vw,.58rem);
    color: var(--muted);
    letter-spacing: .08em;
    opacity: .5;
  }

  /* ── Timer bar ── */
  .timer-bar-wrap {
    width: 120px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 2px;
  }
  .timer-bar-fill {
    height: 100%;
    width: 100%;
    background: var(--accent);
    box-shadow: var(--glow-y);
    transform-origin: left;
    transition: background .3s;
  }
  .timer-bar-fill.urgent { background: var(--red); box-shadow: var(--glow-r); }

  .readout {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 5px 14px;
    clip-path: polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%);
    display: flex; gap: 20px;
    font-size: clamp(.45rem,1.2vw,.65rem);
    letter-spacing: .08em;
    white-space: nowrap;
  }
  .readout span { color: var(--muted); }
  .readout b    { color: var(--accent); font-weight: 600; }

  /* ── D-PAD ── */
  .dpad-wrap {
    display: flex;
    align-items: center; justify-content: center;
    flex: 0 0 auto;
  }

  .dpad {
    position: relative;
    width:  clamp(130px, 22vw, 190px);
    height: clamp(130px, 22vw, 190px);
  }

  .dp {
    position: absolute;
    background: var(--btn);
    border: 1.5px solid var(--border);
    color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    user-select: none; -webkit-user-select: none;
    transition: background .07s, color .07s, box-shadow .07s;
  }

  .dp-u, .dp-d { width:33.33%; height:33.33%; left:33.33%; }
  .dp-l, .dp-r { width:33.33%; height:33.33%; top:33.33%; }
  .dp-u { top:0;     clip-path:polygon(0 20%,50% 0,100% 20%,100% 100%,0 100%); }
  .dp-d { top:66.66%;clip-path:polygon(0 0,100% 0,100% 80%,50% 100%,0 80%); }
  .dp-l { left:0;    clip-path:polygon(0 50%,20% 0,100% 0,100% 100%,20% 100%); }
  .dp-r { left:66.66%;clip-path:polygon(0 0,80% 0,100% 50%,80% 100%,0 100%); }

  .dp.on { background: var(--accent); color: #000; box-shadow: var(--glow-y); border-color: var(--accent); }

  .dp-centre {
    position: absolute;
    top:33.33%; left:33.33%;
    width:33.33%; height:33.33%;
    background: var(--border);
    display:flex; align-items:center; justify-content:center;
  }
  .dp-dot { width:8px; height:8px; border-radius:50%; background:var(--muted); }

  .arrow { width: clamp(14px,2.2vw,20px); height: clamp(14px,2.2vw,20px); fill:currentColor; pointer-events:none; }

  /* ── A BUTTON ── */
  .action-wrap {
    display: flex;
    align-items: center; justify-content: center;
    flex: 0 0 auto;
  }

  .btn-a {
    width:  clamp(80px,14vw,120px);
    height: clamp(80px,14vw,120px);
    border-radius: 50%;
    background: var(--btn);
    border: 2.5px solid var(--red);
    color: var(--red);
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1.2rem,3vw,2rem);
    font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    user-select: none; -webkit-user-select: none;
    transition: background .07s, color .07s, box-shadow .07s;
    box-shadow: 0 0 0 8px rgba(255,59,59,.07);
  }
  .btn-a.on { background:var(--red); color:#fff; box-shadow:var(--glow-r); }

  #ctrl::before, #ctrl::after {
    content: '';
    position: absolute;
    width: 60px; height: 60px;
    border-color: var(--border);
    border-style: solid;
    opacity: .4;
    pointer-events: none;
  }
  #ctrl::before { top:12px; left:12px;  border-width:2px 0 0 2px; }
  #ctrl::after  { bottom:12px; right:12px; border-width:0 2px 2px 0; }
</style>
</head>
<body>

<!-- Rotate nudge -->
<div id="rotateMsg">
  <svg viewBox="0 0 24 24"><path d="M16.48 2.52c3.27 1.55 5.61 4.72 5.97 8.48h1.55C23.44 4.84 18.29 0 12 0l-.66.03 3.81 3.81 1.33-1.32zm-6.25-.77c-.59-.59-1.54-.59-2.12 0L1.75 8.11c-.59.59-.59 1.54 0 2.12l14.14 14.14c.59.59 1.54.59 2.12 0l6.36-6.36c.59-.59.59-1.54 0-2.12L10.23 1.75zm4.6 19.44l-14.14-14.13 6.36-6.36 14.14 14.13-6.36 6.36zm-7.57 1.34C4.01 20.97 1.67 17.8 1.31 14.04H-.24C.15 19.16 5.3 24 11.59 24l.66-.03-3.81-3.81-1.18 1.37z"/></svg>
  <p>ROTATE TO LANDSCAPE</p>
</div>

<!-- Session Ended Overlay -->
<div id="sessionEndedOverlay">
  <div class="ended-icon">⏱</div>
  <div class="ended-title">SESSION ENDED</div>
  <div class="ended-sub">Time's up — your score has been saved</div>
  <div class="ended-score" id="endedScoreDisplay" style="display:none"></div>
  <div class="ended-actions">
    <button class="cta" onclick="playAgain()">▶ PLAY AGAIN</button>
    <button class="btn-outline" onclick="location.reload()">↺ REFRESH PAGE</button>
  </div>
</div>

<!-- App root -->
<div id="app">

  <!-- START -->
  <div class="screen" id="startScreen">
    <div class="logo">CTR<em>L</em></div>
    <div class="subtitle">Remote Game Controller</div>

    <div class="name-wrap">
      <div class="name-label">◈ Player Name</div>
      <input
        class="name-input"
        id="nameInput"
        type="text"
        maxlength="16"
        placeholder="ENTER NAME"
        autocomplete="off"
        spellcheck="false"
      />
    </div>

    <button class="cta" id="startBtn" onclick="tryStart()">▶ START SESSION</button>
    <div style="font-size:.7rem;color:var(--muted);letter-spacing:.08em;min-height:1em" id="startMsg"></div>

    <!-- Leaderboard (shown on start screen) -->
    <div class="lb-wrap" id="lbWrap">
      <div class="lb-title">◈ LEADERBOARD</div>
      <div id="lbRows"><div class="lb-empty">LOADING...</div></div>
    </div>
  </div>

  <!-- WAIT -->
  <div class="screen" id="waitScreen" style="display:none">
    <div class="logo">CTR<em>L</em></div>
    <div class="spinner"></div>
    <div class="subtitle">Session Occupied</div>
    <div style="font-size:.72rem;color:var(--muted);max-width:280px;text-align:center;line-height:1.7">
      Another player is active.<br/>You'll be let in automatically when they finish.
    </div>
    <div class="pulse-row"><div class="pdot"></div>MONITORING</div>
  </div>

  <!-- CONTROLLER -->
  <div id="ctrl">

    <!-- LEFT: D-Pad -->
    <div class="dpad-wrap">
      <div class="dpad" id="dpad">
        <div class="dp dp-u" id="bUp">
          <svg class="arrow" viewBox="0 0 24 24"><path d="M12 4l-8 10h16z"/></svg>
        </div>
        <div class="dp dp-d" id="bDown">
          <svg class="arrow" viewBox="0 0 24 24"><path d="M12 20l8-10H4z"/></svg>
        </div>
        <div class="dp dp-l" id="bLeft">
          <svg class="arrow" viewBox="0 0 24 24"><path d="M4 12l10-8v16z"/></svg>
        </div>
        <div class="dp dp-r" id="bRight">
          <svg class="arrow" viewBox="0 0 24 24"><path d="M20 12L10 4v16z"/></svg>
        </div>
        <div class="dp-centre"><div class="dp-dot"></div></div>
      </div>
    </div>

    <!-- CENTRE: status -->
    <div class="centre">
      <div class="ctrl-title">◈ CTRL</div>
      <div class="live-badge"><div class="dot"></div>LIVE</div>
      <div class="player-badge" id="pBadge">—</div>
      <div class="timer-bar-wrap">
        <div class="timer-bar-fill" id="timerBarFill"></div>
      </div>
      <div class="readout">
        <span>INPUT&nbsp;<b id="iDisp">—</b></span>
        <span>SYNC&nbsp;<b id="iSent">—</b></span>
      </div>
      <div class="session-badge" id="sBadge">—</div>
    </div>

    <!-- RIGHT: A button -->
    <div class="action-wrap">
      <div class="btn-a" id="bA">A</div>
    </div>

  </div><!-- /ctrl -->
</div><!-- /app -->

<script>
// ══════════════════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════════════════
const FB       = 'https://clawmachine-cde3e-default-rtdb.firebaseio.com';
const PATH     = '/ctrl';
const LB_PATH  = '/leaderboard';
const TTL      = 10000;
const LB_MAX   = 10;

const fbUrl    = ()  => FB + PATH + '.json';
const lbUrl    = ()  => FB + LB_PATH + '.json';

async function fbRead(url = fbUrl()) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('Read ' + r.status);
  return r.json();
}

async function fbWrite(url, data) {
  const r = await fetch(url, {
    method:  'PUT',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify(data)
  });
  if (!r.ok) throw new Error('Write ' + r.status);
}

// ══════════════════════════════════════════════════════
//  UNITY DETECTION — ?unity=1  → return bare JSON only
// ══════════════════════════════════════════════════════
const IS_UNITY = new URLSearchParams(location.search).has('unity');

async function serveUnity() {
  let out;
  try {
    const d    = await fbRead();
    const now  = Date.now();
    const alive = d && d.sessionActive && (now - (d.sessionTs || 0)) < TTL;
    out = {
      sessionActive: !!alive,
      playerName: alive ? (d.playerName || '') : '',
      input: {
        up:    !!(alive && d.input?.up),
        down:  !!(alive && d.input?.down),
        left:  !!(alive && d.input?.left),
        right: !!(alive && d.input?.right),
        a:     !!(alive && d.input?.a)
      },
      timestamp: now
    };
  } catch(e) {
    out = { error: e.message, sessionActive:false, playerName:'',
            input:{up:false,down:false,left:false,right:false,a:false} };
  }
  document.open('text/plain');
  document.write(JSON.stringify(out));
  document.close();
}

// ══════════════════════════════════════════════════════
//  SCREEN HELPER
// ══════════════════════════════════════════════════════
function show(id) {
  ['startScreen','waitScreen','ctrl'].forEach(s => {
    const el = document.getElementById(s);
    el.style.display = s === id ? 'flex' : 'none';
  });
}

// ══════════════════════════════════════════════════════
//  LEADERBOARD
// ══════════════════════════════════════════════════════
async function loadLeaderboard() {
  const container = document.getElementById('lbRows');
  try {
    const data = await fbRead(lbUrl());
    if (!data) {
      container.innerHTML = '<div class="lb-empty">NO SCORES YET — BE THE FIRST!</div>';
      return;
    }

    const entries = Object.values(data)
      .sort((a,b) => (b.score||0) - (a.score||0))
      .slice(0, LB_MAX);

    if (!entries.length) {
      container.innerHTML = '<div class="lb-empty">NO SCORES YET — BE THE FIRST!</div>';
      return;
    }

    container.innerHTML = entries.map((e, i) => {
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i+1}`;
      const cls   = i === 0 ? 'lb-row top1' : i === 1 ? 'lb-row top2' : i === 2 ? 'lb-row top3' : 'lb-row';
      return `<div class="${cls}">
        <div class="lb-rank">${medal}</div>
        <div class="lb-name">${escHtml(e.name || 'ANON')}</div>
        <div class="lb-score">${(e.score||0).toLocaleString()} PTS</div>
      </div>`;
    }).join('');

  } catch(ex) {
    container.innerHTML = '<div class="lb-empty">COULD NOT LOAD LEADERBOARD</div>';
  }
}

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ══════════════════════════════════════════════════════
//  SESSION STATE
// ══════════════════════════════════════════════════════
let hbTimer        = null;
let waitTimer      = null;
let sessionMonitor = null;
let myToken        = null;
let myName         = '';
let sessionKilled  = false;   // guard: prevent double-trigger

const inp = { up:false, down:false, left:false, right:false, a:false };

// ══════════════════════════════════════════════════════
//  SESSION MONITOR — detects when Unity kills the session
// ══════════════════════════════════════════════════════
function startSessionMonitor() {
  sessionKilled = false;
  sessionMonitor = setInterval(async () => {
    if (sessionKilled) return;
    try {
      const d   = await fbRead();
      const now = Date.now();
      // Alive = sessionActive flag is true AND heartbeat is fresh
      const alive = d && d.sessionActive && (now - (d.sessionTs || 0)) < TTL;
      if (!alive) {
        handleSessionKilled('TIME UP');
      }
    } catch(e) { /* network hiccup — keep monitoring */ }
  }, 1500);
}

function stopSessionMonitor() {
  clearInterval(sessionMonitor);
  sessionMonitor = null;
}

async function handleSessionKilled(reason = 'SESSION ENDED') {
  if (sessionKilled) return;   // run once
  sessionKilled = true;

  stopSessionMonitor();
  clearInterval(hbTimer);
  hbTimer = null;

  // Kill all button states
  Object.keys(inp).forEach(k => inp[k] = false);
  ['bUp','bDown','bLeft','bRight','bA'].forEach(id => {
    document.getElementById(id)?.classList.remove('on');
  });

  // Show the "session ended" overlay on top of the controller
  const overlay = document.getElementById('sessionEndedOverlay');
  overlay.classList.add('visible');
}

// Called by "PLAY AGAIN" button on the overlay
async function playAgain() {
  const overlay = document.getElementById('sessionEndedOverlay');
  overlay.classList.remove('visible');

  // Reset UI
  myToken = null;
  myName  = '';
  document.getElementById('startBtn').disabled = false;
  document.getElementById('startMsg').textContent = '✓ SESSION ENDED — ENTER YOUR NAME TO PLAY AGAIN';
  document.getElementById('nameInput').value = '';

  show('startScreen');
  await loadLeaderboard();
}

// ══════════════════════════════════════════════════════
//  START SESSION
// ══════════════════════════════════════════════════════
async function tryStart() {
  const btn      = document.getElementById('startBtn');
  const msg      = document.getElementById('startMsg');
  const nameEl   = document.getElementById('nameInput');
  const rawName  = nameEl.value.trim().toUpperCase();

  if (!rawName) {
    msg.textContent = '✗ ENTER YOUR NAME FIRST';
    nameEl.focus();
    return;
  }

  myName = rawName;
  btn.disabled = true;
  msg.textContent = 'CHECKING...';

  try {
    const d    = await fbRead();
    const now  = Date.now();
    const alive = d && d.sessionActive && (now - (d.sessionTs || 0)) < TTL;
    if (alive) {
      show('waitScreen');
      startWaitPoll();
    } else {
      myToken = Math.random().toString(36).slice(2,8).toUpperCase();
      await fbWrite(fbUrl(), {
        sessionActive: true,
        sessionTs:     Date.now(),
        sessionToken:  myToken,
        playerName:    myName,
        input: { up:false, down:false, left:false, right:false, a:false }
      });
      document.getElementById('sBadge').textContent  = 'SID ' + myToken;
      document.getElementById('pBadge').textContent  = '▶ ' + myName;
      show('ctrl');
      bindControls();
      startHb();
      startSessionMonitor();   // watch for Unity-side session termination
    }
  } catch(e) {
    btn.disabled = false;
    msg.textContent = '✗ ' + e.message;
  }
}

// ══════════════════════════════════════════════════════
//  HEARTBEAT
// ══════════════════════════════════════════════════════
function startHb() {
  hbTimer = setInterval(async () => {
    if (sessionKilled) return;
    try {
      await fbWrite(fbUrl(), {
        sessionActive: true,
        sessionTs:     Date.now(),
        sessionToken:  myToken,
        playerName:    myName,
        input: { ...inp }
      });
      refreshDisp();
    } catch(e) {}
  }, 300);

  window.addEventListener('beforeunload', releaseSession);
}

async function releaseSession() {
  stopSessionMonitor();
  clearInterval(hbTimer);
  hbTimer = null;
  try {
    await fbWrite(fbUrl(), {
      sessionActive: false, sessionTs: 0, sessionToken: null, playerName: null,
      input: { up:false, down:false, left:false, right:false, a:false }
    });
  } catch(e) {}
}

// ══════════════════════════════════════════════════════
//  WAIT POLL (queue while session occupied)
// ══════════════════════════════════════════════════════
function startWaitPoll() {
  waitTimer = setInterval(async () => {
    try {
      const d    = await fbRead();
      const now  = Date.now();
      const alive = d && d.sessionActive && (now - (d.sessionTs||0)) < TTL;
      if (!alive) {
        clearInterval(waitTimer);
        document.getElementById('startBtn').disabled = false;
        document.getElementById('startMsg').textContent = '';
        show('startScreen');
        loadLeaderboard();
      }
    } catch(e) {}
  }, 2500);
}

// ══════════════════════════════════════════════════════
//  INPUT BINDING
// ══════════════════════════════════════════════════════
function bindControls() {
  [['bUp','up'],['bDown','down'],['bLeft','left'],['bRight','right'],['bA','a']]
  .forEach(([id, key]) => {
    const el = document.getElementById(id);
    const dn = e => { e.preventDefault(); if(sessionKilled) return; inp[key]=true;  el.classList.add('on'); };
    const up = e => { e.preventDefault(); inp[key]=false; el.classList.remove('on'); };
    el.addEventListener('touchstart',  dn, {passive:false});
    el.addEventListener('touchend',    up, {passive:false});
    el.addEventListener('touchcancel', up, {passive:false});
    el.addEventListener('mousedown', dn);
    el.addEventListener('mouseup',   up);
    el.addEventListener('mouseleave',up);
  });

  const km = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',KeyA:'a',Space:'a'};
  window.addEventListener('keydown', e => {
    if (sessionKilled) return;
    const k=km[e.code]; if(!k) return; e.preventDefault(); inp[k]=true;
    document.getElementById('b'+k[0].toUpperCase()+k.slice(1))?.classList.add('on');
  });
  window.addEventListener('keyup', e => {
    const k=km[e.code]; if(!k) return; inp[k]=false;
    document.getElementById('b'+k[0].toUpperCase()+k.slice(1))?.classList.remove('on');
  });
}

function refreshDisp() {
  const a = Object.entries(inp).filter(([,v])=>v).map(([k])=>k.toUpperCase()).join('+') || '—';
  document.getElementById('iDisp').textContent = a;
  const n = new Date();
  document.getElementById('iSent').textContent =
    String(n.getHours()).padStart(2,'0')+':'+
    String(n.getMinutes()).padStart(2,'0')+':'+
    String(n.getSeconds()).padStart(2,'0');
}

// ══════════════════════════════════════════════════════
//  BOOT
// ══════════════════════════════════════════════════════
window.addEventListener('load', async () => {
  if (IS_UNITY) { await serveUnity(); return; }
  show('startScreen');
  loadLeaderboard();
});
</script>
